[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spine-segment"
version = "0.1.7b1"
description = "Standalone CLI-first vertebral CT segmentation package"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Matthias Walle" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26,<3",
  "SimpleITK>=2.5",
  "torch",
]

[project.optional-dependencies]
test = ["pytest>=8"]
beta = ["nnunetv2>=2,<3", "scipy>=1.11"]

[project.scripts]
spine-segment = "spine_segment.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spine_segment = [
  "resources/*.pickle",
  "models/beta_detailed/dataset.json",
  "models/beta_detailed/plans.json",
  "models/beta_detailed/MODEL_CARD.txt",
  "models/beta_detailed/fold_0/checkpoint_best.pth",
]
